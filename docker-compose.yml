services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traveltogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traveltogether"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=db;Port=5432;Database=traveltogether;Username=postgres;Password=postgres"
      Database__ApplyMigrationsOnStartup: "true"
      Swagger__Enabled: "true"
      # Demo value; set JWT_SIGNING_KEY in the environment or a .env file for anything real.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-docker-demo-signing-key-change-me-0123456789}"

volumes:
  pgdata:
