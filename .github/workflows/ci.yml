name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TravelTogether.slnx

      - name: Build
        run: dotnet build TravelTogether.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TravelTogether.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Check that the model matches the migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TravelTogether.Infrastructure --configuration Release --no-build

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag traveltogether-api .
